[project]
name = "orb-voice-server"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pipecat-ai[cartesia,openai,silero,webrtc,runner]==1.11.0",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
