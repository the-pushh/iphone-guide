name: Orb
options:
  bundleIdPrefix: com.iphoneguide
  deploymentTarget:
    iOS: '17.0'
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    exactVersion: 2.4.1
  PipecatClientIOS:
    url: https://github.com/pipecat-ai/pipecat-client-ios.git
    exactVersion: 1.3.0
  PipecatClientIOSSmallWebrtc:
    url: https://github.com/pipecat-ai/pipecat-client-ios-small-webrtc.git
    exactVersion: 1.3.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ZWG2JN7XFT
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Orb:
    type: application
    platform: iOS
    sources: [Orb]
    dependencies:
      - package: MarkdownUI
      - package: PipecatClientIOS
      - package: PipecatClientIOSSmallWebrtc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iphoneguide.Orb
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Speak with Orb and see your words transcribed in the conversation.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your voice server on your local network.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_CFBundleDisplayName: Orb
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Orb/Info.plist
      properties:
        UIBackgroundModes: [audio]
        LSApplicationQueriesSchemes: [chatgpt, claude]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  Orb:
    build:
      targets:
        Orb: all
